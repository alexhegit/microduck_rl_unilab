[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[project]
name = "microduck-rl-unilab"
version = "0.1.0"
description = "Pollen Robotics MicroDuck RL training built on the UniLab package distribution"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "UniLab" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    # unilab is temporarily git-pinned: PyPI unilab 0.1.0 predates both the
    # in-repo microduck removal (Motphys/UniLab#1495) and the
    # read_reset_root_pose base API (#1494). Switch back to
    # "unilab[mujoco,mjwarp]==x.y.z" once a release includes both.
    "unilab[mujoco,mjwarp]",
    "unilab-rl==0.2.0",
    # Re-declared as a direct dependency so the git source below applies
    # (tool.uv.sources only affects direct dependencies); bound mirrors
    # unilab's own unisim-core constraint.
    "unisim-core>=0.1.14",
    # Re-declared as a direct dependency so the cu128 index source below
    # applies (tool.uv.sources only affects direct dependencies); pins mirror
    # unilab's own torch markers.
    "torch==2.9.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch==2.8.0 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "huggingface_hub>=0.25",
]

[project.scripts]
microduck-train = "microduck_rl_unilab.cli:train_main"
microduck-eval = "microduck_rl_unilab.cli:eval_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
unilab = { git = "https://github.com/Motphys/UniLab.git", rev = "f7591657fb1cf22188892282cb598af34f072ece" }
# Temporary git pin: PyPI unisim-core 1.0.0 predates unilabsim/unisim PR #20
# (mjwarp set_pre_step_control, required for BAM voltage actuation on the
# mjwarp backend). Drop this pin once a unisim-core release includes #20.
unisim-core = { git = "https://github.com/unilabsim/unisim.git", rev = "61aaa34d5ddbc46ca163e720268c0c388485d7de" }
torch = [
    { index = "pytorch-cu128", marker = "sys_platform=='linux' and platform_machine=='x86_64'" },
    { index = "pytorch-cu128", marker = "sys_platform=='win32'" },
]

[tool.uv]
# mujoco-uni-runtime records the build-time mujoco version in its native
# extension; always compile it from the sdist against the resolved mujoco
# (same rationale as UniLab's own pyproject.toml).
no-build-isolation-package = ["mujoco-uni-runtime"]
no-binary-package = ["mujoco-uni-runtime"]

[tool.pytest.ini_options]
markers = [
    "slow: marks slow tests (real backend env builds, asset downloads)",
]
